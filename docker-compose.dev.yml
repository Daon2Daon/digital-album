# Digital Album - Local Docker Build
# 로컬 개발 및 테스트용

name: digital-album-local

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: digital-album-local
    environment:
      NODE_ENV: development
      PORT: ${PORT:-8754}
      DATABASE_URL: file:/app/prisma/database.db
    ports:
      - "${PORT:-8754}:${PORT:-8754}"
    volumes:
      - uploads_data:/app/public/uploads
      - db_data:/app/prisma
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "node -e \"require('http').get('http://localhost:'+(process.env.PORT||8754)+'/api/viewer/images', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  uploads_data:
    name: digital-album-local_uploads
    driver: local
  db_data:
    name: digital-album-local_db
    driver: local
