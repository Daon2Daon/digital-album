# Digital Album - Docker Compose Configuration
# For Synology NAS deployment
# Using SQLite database (no separate database container needed)

services:
  # Application Server
  app:
    image: ghcr.io/daon2daon/digital-album:latest
    container_name: ipad-mini-album
    # Watchtower 자동 업데이트 활성화
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    environment:
      NODE_ENV: production
      PORT: ${PORT:-20005}
      DATABASE_URL: file:/app/prisma/database.db
    ports:
      - "${PORT:-20005}:${PORT:-20005}"
    volumes:
      - uploads_data:/app/public/uploads
      - db_data:/app/prisma
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "node -e \"require('http').get('http://localhost:'+process.env.PORT+'/api/viewer/images', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

# Named volumes for data persistence
volumes:
  uploads_data:
    name: digital-album_uploads_v2
    driver: local
  db_data:
    name: digital-album_db_v2
    driver: local
